name: Referencer tests

on:
  pull_request:
    paths: ["kbs-referencer/**"]
  push:
    branches: [main]
    paths: ["kbs-referencer/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kbs-referencer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kbs-referencer/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
